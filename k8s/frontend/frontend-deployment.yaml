apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumina-frontend
  namespace: lumina
  labels:
    app.kubernetes.io/name: lumina-frontend
    app.kubernetes.io/part-of: lumina-lms
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: lumina-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumina-frontend
        app.kubernetes.io/part-of: lumina-lms
    spec:
      containers:
        - name: frontend
          image: developerpraise/lumina-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: lumina-frontend-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
