apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lumina-backend-hpa
  namespace: lumina
  labels:
    app.kubernetes.io/name: lumina-backend
    app.kubernetes.io/part-of: lumina-lms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lumina-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lumina-frontend-hpa
  namespace: lumina
  labels:
    app.kubernetes.io/name: lumina-frontend
    app.kubernetes.io/part-of: lumina-lms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lumina-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
