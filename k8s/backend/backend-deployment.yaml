apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumina-backend
  namespace: lumina
  labels:
    app.kubernetes.io/name: lumina-backend
    app.kubernetes.io/part-of: lumina-lms
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: lumina-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumina-backend
        app.kubernetes.io/part-of: lumina-lms
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL service to be ready..."
              until nc -z -v -w3 postgres 5432; do
                echo "PostgreSQL is unavailable - sleeping 2s"
                sleep 2
              done
              echo "PostgreSQL is reachable!"
      containers:
        - name: backend
          image: developerpraise/lumina-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: lumina-backend-config
            - secretRef:
                name: lumina-backend-secret
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
