<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="feGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="beGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="cicdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="nlbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    
    <!-- Filter for subtle drop shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2dd4bf" />
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1300" height="900" fill="url(#bgGrad)" />

  <!-- HEADER -->
  <g transform="translate(40, 30)">
    <rect width="1220" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="38" fill="#f8fafc" font-size="22" font-weight="700">Lumina LMS — Production Architecture on AWS EKS</text>
    <text x="1190" y="37" text-anchor="end" fill="#94a3b8" font-size="13">Multi-AZ High Availability • Zero-Downtime GitOps CI/CD • Real-Time WebSockets</text>
  </g>

  <!-- CLIENT TIER (LEFT) -->
  <g transform="translate(40, 110)">
    <rect width="180" height="430" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect width="180" height="40" rx="12" fill="#2563eb" />
    <text x="90" y="26" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">1. CLIENTS &amp; ACCESS</text>

    <!-- Student Browser -->
    <g transform="translate(15, 60)">
      <rect width="150" height="70" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="75" y="28" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Student Browser</text>
      <text x="75" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">Next.js UI &amp; Lessons</text>
    </g>

    <!-- Real-time Chat User -->
    <g transform="translate(15, 150)">
      <rect width="150" height="70" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="75" y="28" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Peer &amp; Instructor</text>
      <text x="75" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">Real-Time DMs &amp; Rooms</text>
    </g>

    <!-- DNS / Route 53 -->
    <g transform="translate(15, 240)">
      <rect width="150" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="75" y="26" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600">DNS / CNAME</text>
      <text x="75" y="44" text-anchor="middle" fill="#94a3b8" font-size="11">Custom Domain Entry</text>
    </g>

    <!-- Protocols badge -->
    <g transform="translate(15, 320)">
      <rect width="150" height="90" rx="8" fill="#090d16" stroke="#334155" stroke-dasharray="4" />
      <text x="75" y="25" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="600">Traffic Protocols</text>
      <text x="75" y="46" text-anchor="middle" fill="#cbd5e1" font-size="11">HTTPS (Port 443)</text>
      <text x="75" y="64" text-anchor="middle" fill="#cbd5e1" font-size="11">WSS / WebSocket</text>
      <text x="75" y="80" text-anchor="middle" fill="#64748b" font-size="10">REST API &amp; Socket.IO</text>
    </g>
  </g>

  <!-- AWS CLOUD / VPC CONTAINER -->
  <g transform="translate(250, 110)">
    <!-- VPC Boundary -->
    <rect width="760" height="750" rx="14" fill="url(#awsGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#dropShadow)" />
    
    <!-- VPC Header Tag -->
    <rect x="20" y="16" width="380" height="30" rx="6" fill="#f59e0b" />
    <text x="30" y="37" fill="#0f172a" font-size="14" font-weight="800">AWS Cloud — VPC (10.0.0.0/16) | Region: us-east-1</text>

    <!-- Internet Gateway & NLB Section -->
    <g transform="translate(20, 60)">
      <rect width="720" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="20" y="25" fill="#f59e0b" font-size="13" font-weight="700">PUBLIC INGRESS SUBNETS (Multi-AZ: us-east-1a, us-east-1b)</text>

      <!-- IGW Box -->
      <g transform="translate(20, 35)">
        <rect width="200" height="38" rx="6" fill="#1e293b" stroke="#64748b" />
        <text x="100" y="24" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Internet Gateway (IGW)</text>
      </g>

      <!-- NLB Box -->
      <g transform="translate(250, 35)">
        <rect width="450" height="38" rx="6" fill="url(#nlbGrad)" />
        <text x="225" y="24" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="800">AWS Network Load Balancer (NLB) — TLS Termination / L4 Passthrough</text>
      </g>
    </g>

    <!-- EKS CLUSTER CONTAINER -->
    <g transform="translate(20, 160)">
      <rect width="720" height="570" rx="12" fill="#090d16" stroke="#3b82f6" stroke-width="1.8" />
      
      <!-- EKS Header -->
      <rect x="15" y="12" width="690" height="30" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="25" y="32" fill="#38bdf8" font-size="13" font-weight="700">AWS EKS Cluster (Kubernetes v1.31) — Managed Node Group (2x t3.medium)</text>
      <text x="690" y="32" text-anchor="end" fill="#64748b" font-size="12">autoscaling: 1 to 4 nodes</text>

      <!-- NGINX INGRESS CONTROLLER -->
      <g transform="translate(20, 52)">
        <rect width="680" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
        <text x="20" y="24" fill="#38bdf8" font-size="14" font-weight="700">NGINX Ingress Controller (Namespace: ingress-nginx)</text>
        <text x="20" y="48" fill="#cbd5e1" font-size="12">Path Routing: <tspan fill="#38bdf8" font-weight="600">/ </tspan>→ Frontend | <tspan fill="#38bdf8" font-weight="600">/api </tspan>→ Backend REST | <tspan fill="#38bdf8" font-weight="600">/socket.io </tspan>→ WebSocket Upgrade (Sticky Sessions)</text>
      </g>

      <!-- NAMESPACE: LUMINA -->
      <g transform="translate(20, 130)">
        <rect width="680" height="425" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.2" />
        <rect x="15" y="10" width="220" height="24" rx="4" fill="#334155" />
        <text x="25" y="27" fill="#f8fafc" font-size="12" font-weight="700">Dedicated Namespace: lumina</text>

        <!-- TIER 1: FRONTEND WORKLOAD -->
        <g transform="translate(15, 42)">
          <rect width="315" height="155" rx="8" fill="#132338" stroke="#0284c7" stroke-width="1.5" />
          <text x="15" y="22" fill="#38bdf8" font-size="13" font-weight="700">Frontend Tier (Next.js 16 / React 19)</text>
          
          <!-- Pod 1 -->
          <rect x="15" y="35" width="135" height="50" rx="6" fill="url(#feGrad)" />
          <text x="82" y="56" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">lumina-frontend-1</text>
          <text x="82" y="72" text-anchor="middle" fill="#bae6fd" font-size="10">Zone: us-east-1a</text>

          <!-- Pod 2 -->
          <rect x="165" y="35" width="135" height="50" rx="6" fill="url(#feGrad)" />
          <text x="232" y="56" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">lumina-frontend-2</text>
          <text x="232" y="72" text-anchor="middle" fill="#bae6fd" font-size="10">Zone: us-east-1b</text>

          <!-- HPA Badge -->
          <rect x="15" y="95" width="285" height="48" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-dasharray="3" />
          <text x="25" y="114" fill="#38bdf8" font-size="11" font-weight="700">Horizontal Pod Autoscaler (HPA)</text>
          <text x="25" y="132" fill="#e0f2fe" font-size="10">Autoscales 2 → 6 Replicas (Target: 70% CPU, 80% RAM)</text>
        </g>

        <!-- TIER 2: BACKEND API WORKLOAD -->
        <g transform="translate(350, 42)">
          <rect width="315" height="155" rx="8" fill="#1a1c38" stroke="#6366f1" stroke-width="1.5" />
          <text x="15" y="22" fill="#818cf8" font-size="13" font-weight="700">Backend API Tier (Node / Express / Socket.io)</text>
          
          <!-- Pod 1 -->
          <rect x="15" y="35" width="135" height="50" rx="6" fill="url(#beGrad)" />
          <text x="82" y="56" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">lumina-backend-1</text>
          <text x="82" y="72" text-anchor="middle" fill="#c7d2fe" font-size="10">Zone: us-east-1a</text>

          <!-- Pod 2 -->
          <rect x="165" y="35" width="135" height="50" rx="6" fill="url(#beGrad)" />
          <text x="232" y="56" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">lumina-backend-2</text>
          <text x="232" y="72" text-anchor="middle" fill="#c7d2fe" font-size="10">Zone: us-east-1b</text>

          <!-- HPA Badge -->
          <rect x="15" y="95" width="285" height="48" rx="6" fill="#312e81" stroke="#818cf8" stroke-dasharray="3" />
          <text x="25" y="114" fill="#a5b4fc" font-size="11" font-weight="700">Horizontal Pod Autoscaler (HPA)</text>
          <text x="25" y="132" fill="#e0e7ff" font-size="10">Autoscales 2 → 6 Replicas (InitContainer DB Readiness)</text>
        </g>

        <!-- TIER 3: DATABASE & PERSISTENCE -->
        <g transform="translate(15, 210)">
          <rect width="450" height="200" rx="8" fill="#0f2922" stroke="#14b8a6" stroke-width="1.5" />
          <text x="15" y="24" fill="#2dd4bf" font-size="13" font-weight="700">Database Tier (StatefulSet &amp; Persistent Volume)</text>

          <!-- Postgres Pod -->
          <g transform="translate(15, 38)">
            <rect width="195" height="80" rx="6" fill="url(#dbGrad)" />
            <text x="97" y="28" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">PostgreSQL 16 Pod</text>
            <text x="97" y="48" text-anchor="middle" fill="#ccfbf1" font-size="11">StatefulSet (postgres:5432)</text>
            <text x="97" y="66" text-anchor="middle" fill="#99f6e4" font-size="10">Non-Exposed ClusterIP</text>
          </g>

          <!-- PVC / Storage -->
          <g transform="translate(230, 38)">
            <rect width="205" height="80" rx="6" fill="#134e4a" stroke="#2dd4bf" />
            <text x="102" y="28" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">PersistentVolumeClaim</text>
            <text x="102" y="48" text-anchor="middle" fill="#ccfbf1" font-size="11">10Gi Volume (ReadWriteOnce)</text>
            <text x="102" y="66" text-anchor="middle" fill="#5eead4" font-size="10">Dynamic Provisioning</text>
          </g>

          <!-- AWS EBS Storage -->
          <g transform="translate(15, 130)">
            <rect width="420" height="55" rx="6" fill="#042f2e" stroke="#2dd4bf" stroke-dasharray="4" />
            <text x="210" y="25" text-anchor="middle" fill="#2dd4bf" font-size="12" font-weight="700">AWS EBS CSI Driver ⟷ AWS EBS gp3 Volume (10Gi)</text>
            <text x="210" y="43" text-anchor="middle" fill="#99f6e4" font-size="10">Independent Volume Persistence • Zero Data Loss on Pod Restart</text>
          </g>
        </g>

        <!-- CONFIG & SECRETS -->
        <g transform="translate(480, 210)">
          <rect width="185" height="200" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1" />
          <text x="15" y="24" fill="#f1f5f9" font-size="12" font-weight="700">Config &amp; Secrets</text>
          
          <rect x="12" y="40" width="160" height="65" rx="6" fill="#0f172a" stroke="#475569" />
          <text x="20" y="62" fill="#38bdf8" font-size="11" font-weight="600">ConfigMap</text>
          <text x="20" y="80" fill="#94a3b8" font-size="10">PORT, CORS, NodeEnv,</text>
          <text x="20" y="94" fill="#94a3b8" font-size="10">Frontend URLs</text>

          <rect x="12" y="118" width="160" height="70" rx="6" fill="#0f172a" stroke="#ef4444" />
          <text x="20" y="140" fill="#f87171" font-size="11" font-weight="600">Kubernetes Secret</text>
          <text x="20" y="158" fill="#94a3b8" font-size="10">DB_PASS, JWT_SECRET,</text>
          <text x="20" y="172" fill="#94a3b8" font-size="10">RESEND_KEY, PAYSTACK</text>
        </g>

      </g>
    </g>
  </g>

  <!-- EXTERNAL SAAS INTEGRATIONS (BOTTOM RIGHT) -->
  <g transform="translate(1030, 110)">
    <rect width="230" height="280" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect width="230" height="40" rx="12" fill="#7c3aed" />
    <text x="115" y="26" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">EXTERNAL SERVICES</text>

    <!-- Resend -->
    <g transform="translate(15, 60)">
      <rect width="200" height="85" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1" />
      <text x="20" y="28" fill="#f1f5f9" font-size="13" font-weight="700">Resend API</text>
      <text x="20" y="50" fill="#c4b5fd" font-size="11">Transactional Email Service</text>
      <text x="20" y="68" fill="#94a3b8" font-size="10">Welcome &amp; Notification Emails</text>
    </g>

    <!-- Paystack -->
    <g transform="translate(15, 165)">
      <rect width="200" height="85" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1" />
      <text x="20" y="28" fill="#f1f5f9" font-size="13" font-weight="700">Paystack API</text>
      <text x="20" y="50" fill="#67e8f9" font-size="11">Payment Gateway Engine</text>
      <text x="20" y="68" fill="#94a3b8" font-size="10">Webhooks &amp; Course Checkout</text>
    </g>
  </g>

  <!-- CI/CD GITOPS PIPELINE (BOTTOM FULL WIDTH) -->
  <g transform="translate(40, 560)">
    <rect width="180" height="300" rx="12" fill="#1e293b" stroke="#e11d48" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect width="180" height="40" rx="12" fill="#e11d48" />
    <text x="90" y="26" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">CI/CD GITOPS</text>

    <!-- GitHub Repo -->
    <g transform="translate(15, 55)">
      <rect width="150" height="60" rx="8" fill="#0f172a" stroke="#f43f5e" />
      <text x="75" y="26" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">GitHub Repo</text>
      <text x="75" y="44" text-anchor="middle" fill="#fda4af" font-size="10">praisedania/Lumina_app</text>
    </g>

    <!-- Actions -->
    <g transform="translate(15, 128)">
      <rect width="150" height="70" rx="8" fill="#0f172a" stroke="#f43f5e" />
      <text x="75" y="24" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">GitHub Actions</text>
      <text x="75" y="42" text-anchor="middle" fill="#cbd5e1" font-size="10">Build • Test • Lint</text>
      <text x="75" y="58" text-anchor="middle" fill="#94a3b8" font-size="9">Outputs Commit SHA Tag</text>
    </g>

    <!-- Docker Hub -->
    <g transform="translate(15, 210)">
      <rect width="150" height="70" rx="8" fill="#0f172a" stroke="#38bdf8" />
      <text x="75" y="24" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Docker Hub</text>
      <text x="75" y="42" text-anchor="middle" fill="#38bdf8" font-size="10">lumina-backend:tag</text>
      <text x="75" y="58" text-anchor="middle" fill="#38bdf8" font-size="10">lumina-frontend:tag</text>
    </g>
  </g>

  <!-- TERRAFORM IAC BADGE (BOTTOM RIGHT) -->
  <g transform="translate(1030, 410)">
    <rect width="230" height="450" rx="12" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect width="230" height="40" rx="12" fill="#6d28d9" />
    <text x="115" y="26" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">TERRAFORM IAC</text>

    <g transform="translate(15, 55)">
      <rect width="200" height="95" rx="8" fill="#0f172a" stroke="#8b5cf6" />
      <text x="20" y="24" fill="#a78bfa" font-size="12" font-weight="700">S3 State Backend</text>
      <text x="20" y="44" fill="#cbd5e1" font-size="11">Bucket: lumina-app-tf-state</text>
      <text x="20" y="62" fill="#cbd5e1" font-size="11">Key: terraform.tfstate</text>
      <text x="20" y="80" fill="#34d399" font-size="10">✓ State Locking Enabled</text>
    </g>

    <g transform="translate(15, 165)">
      <rect width="200" height="260" rx="8" fill="#0f172a" stroke="#475569" />
      <text x="20" y="26" fill="#f8fafc" font-size="12" font-weight="700">Managed Modules:</text>
      <text x="20" y="52" fill="#94a3b8" font-size="11">• Custom VPC (10.0.0.0/16)</text>
      <text x="20" y="74" fill="#94a3b8" font-size="11">• Subnets (2 AZs: 1a &amp; 1b)</text>
      <text x="20" y="96" fill="#94a3b8" font-size="11">• Internet Gateway &amp; Routes</text>
      <text x="20" y="118" fill="#94a3b8" font-size="11">• Security Groups (80, 443)</text>
      <text x="20" y="140" fill="#94a3b8" font-size="11">• EKS Cluster (v1.31)</text>
      <text x="20" y="162" fill="#94a3b8" font-size="11">• Managed Node Group</text>
      <text x="20" y="184" fill="#94a3b8" font-size="11">• IAM Roles &amp; Policies</text>
      <text x="20" y="206" fill="#94a3b8" font-size="11">• EBS CSI Driver Add-on</text>
      <text x="20" y="235" fill="#34d399" font-size="11" font-weight="600">✓ Fully Reproducible</text>
    </g>
  </g>

  <!-- ARROWS & FLOW CONNECTORS -->
  <!-- Client to IGW -->
  <path d="M 220 220 L 285 220" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Backend to Postgres -->
  <path d="M 525 345 L 525 365" fill="none" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrowGreen)" />

  <!-- Backend to External SaaS -->
  <path d="M 940 330 L 1030 200" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />
  <path d="M 940 340 L 1030 300" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />

  <!-- CI/CD to EKS -->
  <path d="M 220 700 L 260 700 L 260 670" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="5" marker-end="url(#arrowRose)" />
</svg>
